name: Publish validated lunar planner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Rebuild authoritative NASA data']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-data.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tools/verify-browser-csv.mjs
      - name: Verify Drive controls, responsive layout and terrain occlusion
        run: node tools/run-drive-reviews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-review
          path: work/drive-review/
          if-no-files-found: ignore
      - name: Independently verify 100 fractional-time positions with JPL Horizons
        run: node tools/verify-visual-interpolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-interpolation-horizons
          path: work/ui-pass-review/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
